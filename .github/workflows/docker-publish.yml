name: Container image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      benchmark:
        description: Measure unchanged, frontend-only and Rust-only cache reuse
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    if: github.repository == 'yash-278/wealthfolio'
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: wealthfolio:test
          cache-from: type=gha,scope=wealthfolio-amd64
          cache-to: |
            type=gha,mode=max,scope=wealthfolio-amd64
            type=local,dest=/tmp/wealthfolio-build-cache,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/yash-278/wealthfolio
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Smoke test disposable container
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then docker logs wealthfolio-smoke; fi
            docker rm -f wealthfolio-smoke >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          export WF_SECRET_KEY
          WF_SECRET_KEY="$(openssl rand -base64 32)"
          docker run --detach --name wealthfolio-smoke \
            --publish 127.0.0.1:18088:8088 \
            --env WF_SECRET_KEY --env WF_AUTH_REQUIRED=false \
            --env WF_MCP_ENABLED=false wealthfolio:test
          curl --fail --silent --show-error --retry 30 --retry-delay 2 \
            --retry-connrefused --retry-all-errors --max-time 5 \
            http://127.0.0.1:18088/api/v1/healthz
          curl --fail --silent --show-error --output /dev/null \
            http://127.0.0.1:18088/
      - name: Sign in to GHCR
        if:
          github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref ==
          'refs/heads/main')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        id: publish
        if:
          github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref ==
          'refs/heads/main')
        shell: bash
        env:
          IMAGE: ghcr.io/yash-278/wealthfolio
        run: |
          set -euo pipefail
          docker tag wealthfolio:test "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA")"
          printf 'digest=%s\n' "${digest#*@}" >> "$GITHUB_OUTPUT"
          printf 'Image: `%s`\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Measure cache reuse
        if: inputs.benchmark
        run: bash scripts/benchmark-image-cache.sh
      - name: Save cache measurements
        if: always() && inputs.benchmark
        uses: actions/upload-artifact@v4
        with:
          name: cache-measurements-${{ github.sha }}
          path: /tmp/wealthfolio-benchmark/

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/promote-railway.yml
    with:
      digest: ${{ needs.image.outputs.digest }}
