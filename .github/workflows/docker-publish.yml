name: Container image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    if: github.repository == 'yash-278/wealthfolio'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: wealthfolio:test
          cache-from: type=gha,scope=wealthfolio-amd64
          cache-to: type=gha,mode=max,scope=wealthfolio-amd64
      - name: Smoke test disposable container
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f wealthfolio-smoke >/dev/null 2>&1 || true' EXIT
          export WF_SECRET_KEY
          WF_SECRET_KEY="$(openssl rand -hex 32)"
          docker run --detach --name wealthfolio-smoke \
            --publish 127.0.0.1:18088:8088 \
            --env WF_SECRET_KEY --env WF_AUTH_REQUIRED=false \
            --env WF_MCP_ENABLED=false wealthfolio:test
          curl --fail --silent --show-error --retry 30 --retry-delay 2 \
            --retry-connrefused --retry-all-errors --max-time 5 \
            http://127.0.0.1:18088/api/v1/healthz
          curl --fail --silent --show-error --output /dev/null \
            http://127.0.0.1:18088/
      - name: Sign in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          IMAGE: ghcr.io/yash-278/wealthfolio
        run: |
          set -euo pipefail
          docker tag wealthfolio:test "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA")"
          printf 'Image: `%s`\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
