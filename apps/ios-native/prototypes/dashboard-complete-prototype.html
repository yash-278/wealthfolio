<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Dashboard feature study</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #091013;
      color: #edf5f5;
      font:
        16px -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      --bg: #111c21;
      --surface: #1b2b31;
      --muted: #a2b2b8;
      --accent: #9bd9d1;
      --blue: #91bceb;
      --line: #33474e;
      --glass: #263b43d9;
      --orange: #efb784;
    }
    body.light {
      background: #dee8eb;
      color: #152d35;
      --bg: #f5f9fa;
      --surface: #fff;
      --muted: #617680;
      --accent: #2b726b;
      --blue: #497da8;
      --line: #d8e3e7;
      --glass: #ffffffda;
      --orange: #a65d2e;
    }
    button,
    select,
    input {
      font: inherit;
      color: inherit;
    }
    button {
      cursor: pointer;
      border: 0;
      background: none;
      min-height: 44px;
    }
    button:focus-visible,
    svg:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    button:hover {
      filter: brightness(1.12);
    }
    .phone {
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      background: var(--bg);
      padding: 0 22px 155px;
    }
    .status {
      display: flex;
      justify-content: space-between;
      padding: 20px 0 16px;
      font-size: 14px;
      font-weight: 650;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 62px;
      position: sticky;
      top: 0;
      z-index: 3;
      background: var(--bg);
    }
    h1 {
      font-size: 21px;
      margin: 0;
    }
    .tools {
      display: flex;
      gap: 6px;
    }
    .round {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--glass);
      color: var(--accent);
      font-size: 24px;
    }
    .round svg {
      width: 21px;
      height: 21px;
      vertical-align: middle;
    }
    .tabs {
      display: flex;
      background: var(--surface);
      border-radius: 28px;
      padding: 4px;
      gap: 2px;
      margin: 12px 0 26px;
    }
    .tabs button {
      flex: 1;
      font-size: 13px;
      padding: 0 7px;
      border-radius: 24px;
      white-space: nowrap;
    }
    .tabs button[aria-selected="true"] {
      background: var(--glass);
      box-shadow: 0 2px 8px #0002;
      color: var(--accent);
      font-weight: 650;
    }
    .muted {
      color: var(--muted);
    }
    .eyebrow {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 10px;
    }
    .value {
      font-size: 40px;
      font-weight: 620;
      letter-spacing: -1.6px;
      font-variant-numeric: tabular-nums;
      margin: 0 0 9px;
    }
    .change {
      font-size: 14px;
      color: var(--accent);
      margin: 0;
    }
    .chart {
      width: 100%;
      height: 230px;
      margin-top: 12px;
      touch-action: pan-y;
      display: block;
    }
    .periods {
      display: flex;
      justify-content: space-between;
      gap: 1px;
      margin: 6px -9px 25px;
      overflow-x: auto;
    }
    .periods button {
      font-size: 12px;
      padding: 0 7px;
      min-width: 35px;
      border-radius: 24px;
      flex: 1;
    }
    .periods .active {
      background: var(--glass);
      color: var(--accent);
    }
    .card {
      padding: 18px;
      background: var(--surface);
      border-radius: 23px;
      margin-bottom: 22px;
    }
    .pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .pair small {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }
    .pair strong {
      font-size: 20px;
      font-weight: 600;
    }
    .section {
      margin: 25px 0;
    }
    .sectionhead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
    }
    h2 {
      font-size: 20px;
      margin: 0;
      font-weight: 620;
    }
    .sectionhead button {
      font-size: 12px;
      color: var(--accent);
      padding-right: 0;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      text-align: left;
      padding: 14px 0;
      min-width: 0;
    }
    .row .txt {
      flex: 1;
      min-width: 0;
    }
    .row b {
      font-weight: 550;
      font-size: 15px;
    }
    .row small {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }
    .row .amount {
      font-size: 15px;
      text-align: right;
      white-space: nowrap;
    }
    .icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      display: grid;
      place-items: center;
      color: var(--accent);
      font-size: 18px;
      flex-shrink: 0;
    }
    .chev {
      color: var(--muted);
    }
    .progress {
      height: 5px;
      background: var(--line);
      border-radius: 5px;
      margin-top: 12px;
      overflow: hidden;
    }
    .progress i {
      display: block;
      background: var(--accent);
      height: 100%;
    }
    .notice {
      color: var(--orange);
      background: color-mix(in srgb, var(--orange) 10%, transparent);
      padding: 14px;
      border-radius: 16px;
      display: block;
      width: 100%;
      text-align: left;
      font-size: 13px;
    }
    .treemap {
      display: grid;
      grid-template-columns: 3fr 2fr;
      gap: 5px;
      margin: 12px 0;
    }
    .treemap button {
      border-radius: 13px;
      text-align: left;
      padding: 18px 12px;
      background: var(--accent);
      color: var(--bg);
      font-size: 13px;
      min-height: 75px;
    }
    .treemap button:first-child {
      grid-row: span 2;
    }
    .treemap button:nth-child(2) {
      background: var(--blue);
    }
    .treemap button:nth-child(3) {
      background: var(--orange);
    }
    .treemap strong {
      display: block;
      font-size: 20px;
      margin-top: 9px;
    }
    .chip {
      border-radius: 20px;
      background: var(--glass);
      padding: 0 15px;
      font-size: 13px;
      color: var(--accent);
    }
    .nav {
      position: fixed;
      bottom: 66px;
      left: 50%;
      transform: translateX(-50%);
      width: min(calc(100% - 26px), 404px);
      display: flex;
      padding: 5px;
      border-radius: 38px;
      background: var(--glass);
      backdrop-filter: blur(22px);
      z-index: 4;
      box-shadow: inset 0 0 0 1px #a7c4cb25;
    }
    .nav button {
      flex: 1;
      font-size: 10px;
      padding: 6px 1px;
    }
    .nav span {
      display: block;
      font-size: 21px;
      margin-bottom: 4px;
    }
    .nav .active {
      color: var(--accent);
      background: var(--bg);
      border-radius: 30px;
    }
    .study {
      position: fixed;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: #f3dc9e;
      color: #253032;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 10px;
      z-index: 5;
      font-size: 11px;
      white-space: nowrap;
      box-shadow: 0 4px 20px #0004;
    }
    .study button {
      font-size: 16px;
    }
    .study strong {
      font-weight: 600;
    }
    dialog {
      width: min(92vw, 414px);
      max-height: 80vh;
      overflow: auto;
      background: var(--surface);
      color: inherit;
      border: 0;
      border-radius: 27px;
      padding: 24px;
      box-shadow: 0 24px 100px #0008;
    }
    dialog::backdrop {
      background: #0007;
      backdrop-filter: blur(4px);
    }
    dialog header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    dialog h2 {
      font-size: 20px;
    }
    dialog p {
      font-size: 14px;
      line-height: 1.6;
    }
    dialog button.close {
      font-size: 22px;
    }
    .detailrow {
      display: flex;
      justify-content: space-between;
      padding: 13px 0;
      gap: 15px;
      font-size: 14px;
    }
    .detailrow span:last-child {
      color: var(--accent);
    }
    select {
      background: var(--surface);
      border: 0;
      padding: 12px;
      border-radius: 15px;
      width: 100%;
    }
    .companions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 18px 0 8px;
    }
    .companions button {
      background: var(--surface);
      padding: 15px;
      border-radius: 20px;
      text-align: left;
      min-width: 0;
    }
    .companions small {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }
    .companions strong {
      display: block;
      font-size: 19px;
      font-weight: 600;
    }
    .overview {
      display: none;
    }
    .variant-B .overview {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin: 8px 0 20px;
    }
    .overview button {
      border-radius: 15px;
      background: var(--surface);
      font-size: 11px;
      text-align: left;
      padding: 12px 8px;
    }
    .overview strong {
      display: block;
      font-size: 16px;
      margin-top: 8px;
    }
    .variant-B .hero {
      background: var(--surface);
      border-radius: 24px;
      padding: 20px;
    }
    .variant-B .chart {
      height: 150px;
    }
    .variant-C main {
      display: flex;
      flex-direction: column;
    }
    .variant-C .hero {
      order: 0;
    }
    .variant-C .hero .chart {
      height: 100px;
    }
    .variant-C .hero .value {
      font-size: 32px;
    }
    .variant-C .primary {
      order: 1;
    }
    .variant-C .secondary {
      order: 2;
    }
    .variant-C .hero .periods {
      margin-bottom: 0;
    }
    .variant-C .hero {
      margin-bottom: 10px;
    }
    .variant-C .section {
      margin-top: 12px;
    }
    .variant-B .primary {
      background: var(--surface);
      padding: 16px;
      border-radius: 22px;
    }
    footer {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
      margin-top: 25px;
    }
    .state {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 14px;
    }
    @media (min-width: 700px) {
      .phone {
        margin: 24px auto;
        border-radius: 36px;
        box-shadow: 0 20px 100px #0003;
      }
      .header {
        border-radius: 12px;
      }
    }
    @media (prefers-reduced-motion: no-preference) {
      button {
        transition:
          background 0.15s,
          opacity 0.15s;
      }
    }

    .mainMetric {
      border-radius: 26px;
      padding: 18px;
      background: var(--glass);
      box-shadow: inset 0 1px 0 #ffffff24;
      margin-bottom: 14px;
      backdrop-filter: blur(20px);
    }
    .companions button {
      background: var(--glass);
      box-shadow: inset 0 1px 0 #ffffff24;
      backdrop-filter: blur(20px);
    }
    ::view-transition-group(metric-0),
    ::view-transition-group(metric-1),
    ::view-transition-group(metric-2) {
      animation-duration: 580ms;
      animation-timing-function: cubic-bezier(0.2, 0.85, 0.2, 1);
    }
    ::view-transition-old(metric-0),
    ::view-transition-old(metric-1),
    ::view-transition-old(metric-2) {
      animation: none;
      opacity: 0;
    }
    ::view-transition-new(metric-0),
    ::view-transition-new(metric-1),
    ::view-transition-new(metric-2) {
      animation: none;
      mix-blend-mode: normal;
      height: 100%;
      object-fit: fill;
    }
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }
    @media (prefers-reduced-motion: reduce) {
      ::view-transition-group(*) {
        animation: none !important;
      }
    }
  </style>
  <div class="phone">
    <div class="status"><span>9:41</span><span>••• ◔ ▰</span></div>
    <header class="header">
      <h1>Dashboard</h1>
      <div class="tools">
        <button class="round" id="privacy" aria-label="Hide balances">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M2 12Q12-1 22 12Q12 25 2 12Z" />
            <circle cx="12" cy="12" r="3" />
          </svg></button
        ><button class="round" id="add" aria-label="Add">+</button
        ><button class="round" id="more" aria-label="Dashboard actions">⋯</button>
      </div>
    </header>
    <div class="tabs" role="tablist" aria-label="Dashboard section"></div>
    <div class="overview"></div>
    <main id="content"></main>
    <footer>
      Interactive mockup · Synthetic data<br />Glass is approximated here. Production UI will use
      SwiftUI.
    </footer>
  </div>
  <nav class="nav" aria-label="App">
    <button class="active"><span>⌁</span>Dashboard</button
    ><button data-page="Activities"><span>≡</span>Activities</button
    ><button data-page="Insights"><span>▥</span>Insights</button
    ><button data-page="Assistant"><span>✧</span>Assistant</button
    ><button data-page="More"><span>⊞</span>More</button>
  </nav>
  <div class="study">
    <button id="prev" aria-label="Previous layout">‹</button><strong id="variantLabel"></strong
    ><button id="next" aria-label="Next layout">›</button
    ><button id="theme" aria-label="Change appearance">◐</button
    ><button id="coverage" aria-label="Feature coverage">☷</button>
  </div>
  <dialog id="sheet">
    <header>
      <h2 id="sheetTitle"></h2>
      <button class="close" aria-label="Close">×</button>
    </header>
    <div id="sheetContent"></div>
  </dialog>
  <script>
    const q = new URLSearchParams(location.search),
      names = ["Investments", "Net worth", "Spending"],
      layouts = { A: "Chart first", B: "Overview first", C: "Accounts first" };
    let tab = q.get("tab") || "Investments",
      variant = q.get("variant") || "A",
      theme = q.get("theme") || "dark",
      hidden = false,
      period = "3M",
      grouped = false,
      holdSort = "value",
      holdMode = "pnl",
      holdName = "symbol",
      contributions = true;
    if (!names.includes(tab)) tab = names[0];
    if (!layouts[variant]) variant = "A";
    const money = (n) =>
        hidden
          ? "••••••"
          : new Intl.NumberFormat("en-IN", {
              style: "currency",
              currency: "INR",
              maximumFractionDigits: 0,
            }).format(n),
      detail = (k, v) => `<div class="detailrow"><span>${k}</span><span>${v}</span></div>`;
    function show(title, html) {
      document.querySelector("#sheetTitle").textContent = title;
      document.querySelector("#sheetContent").innerHTML = html;
      document.querySelector("#sheet").showModal();
    }
    function updateURL() {
      history.replaceState(
        null,
        "",
        `?variant=${variant}&theme=${theme}&tab=${encodeURIComponent(tab)}`,
      );
    }
    function row(name, value, sub = "", icon = "↗", action = name) {
      return `<button class="row" data-detail="${action}"><span class="icon">${icon}</span><span class="txt"><b>${name}</b>${sub ? `<small>${sub}</small>` : ""}</span><span class="amount">${money(value)}</span><span class="chev">›</span></button>`;
    }
    function section(title, body, action = "View all") {
      return `<section class="section"><div class="sectionhead"><h2>${title}</h2><button data-detail="${title}">${action}</button></div>${body}</section>`;
    }
    const data = {
      Investments: {
        value: 482600,
        label: "Portfolio value",
        change: "+₹18,600 · +4.01%",
        base: 400000,
      },
      "Net worth": {
        value: 1642600,
        label: "Net worth",
        change: "+₹42,600 · +2.66%",
        base: 1500000,
      },
      Spending: {
        value: 32400,
        label: "Spent this month",
        change: "₹7,600 left of ₹40,000 budget",
        base: 0,
      },
    };
    function hero() {
      const d = data[tab],
        periods =
          tab === "Spending"
            ? ["MTD", "Last month", "3M", "6M", "YTD", "1Y"]
            : ["1D", "1W", "1M", "3M", "6M", "YTD", "1Y", "5Y", "All"];
      return `<section class="hero"><div class="mainMetric" style="view-transition-name:metric-${names.indexOf(tab)}"><p class="eyebrow">${d.label}</p><p class="value" id="heroValue">${money(d.value)}</p></div><p class="change" id="inspect">${hidden ? "••••••" : d.change}</p><div class="companions">${names
        .filter((t) => t !== tab)
        .map(
          (t) =>
            `<button data-tab="${t}" style="view-transition-name:metric-${names.indexOf(t)}"><small>${t} ↗</small><strong>${money(data[t].value)}</strong></button>`,
        )
        .join(
          "",
        )}</div><svg class="chart" role="slider" aria-label="Inspect chart dates" aria-valuemin="0" aria-valuemax="29" aria-valuenow="29" tabindex="0" viewBox="0 0 380 220"></svg><div class="periods">${periods.map((p) => `<button class="${period === p ? "active" : ""}" data-period="${p}">${p}</button>`).join("")}</div>${tab === "Investments" ? `<button class="chip" id="contributions">${contributions ? "✓ " : ""}Net contributions</button>` : ""}</section>`;
    }
    function investments() {
      let accounts = grouped
        ? `<details open><summary>Banking · ${money(312600)}</summary>${row("Everyday account", 212600, "INR", "▣")}${row("Savings account", 100000, "INR", "▣")}</details>${row("Brokerage", 170000, "INR", "⌁")}`
        : row("Everyday account", 212600, "INR", "▣") +
          row("Brokerage", 170000, "INR", "⌁") +
          row("Savings account", 100000, "INR", "▣");
      const holdings =
        holdSort === "value"
          ? [
              ["INDEX", 110000, "Broad market fund"],
              ["GLOBAL", 60000, "Global equity fund"],
            ]
          : [
              ["GLOBAL", 60000, "Global equity fund"],
              ["INDEX", 110000, "Broad market fund"],
            ];
      return `<div class="primary">${section("Accounts", accounts, "Group / list")}</div><div class="secondary"><div class="card pair"><div><small>Cash</small><strong>${money(312600)}</strong></div><div><small>Invested</small><strong>${money(170000)}</strong></div></div>${section("Holdings", holdings.map(([symbol, value, name]) => row(holdName === "symbol" ? symbol : name, value, holdMode === "daily" ? "+0.4% today" : holdMode === "return" ? "+8.2% return" : holdMode === "unrealized" ? "+₹8,400 unrealized" : "+₹12,400 total gain", "⌁", "Holding details")).join(""), "Filter")}${section("Goals", `<button class="card" style="width:100%;text-align:left" data-detail="Goals"><b>Emergency fund</b><div class="row"><span class="txt">${money(120000)}</span><span class="muted">of ${money(200000)}</span></div><div class="progress"><i style="width:60%"></i></div></button>`)}<button class="notice" data-detail="Data health">ⓘ Prices updated today · View data health</button></div>`;
    }
    function networth() {
      return `<div class="primary">${section("Breakdown", row("Investments", 482600, "29.4%", "⌁") + row("Property", 1500000, "91.3%", "⌂") + row("Other assets", 60000, "3.7%", "◇") + row("Liabilities", -400000, "−24.4%", "−"))}</div><div class="secondary"><div class="card pair"><div><small>Assets</small><strong>${money(2042600)}</strong></div><div><small>Liabilities</small><strong>${money(400000)}</strong></div></div><div class="card"><div class="sectionhead"><h2>Monthly pace</h2><button data-detail="Monthly pace">Details</button></div><p class="value" style="font-size:28px">${money(14200)}<small style="font-size:13px;letter-spacing:0"> / month</small></p><div class="progress"><i style="width:65%"></i></div><p class="eyebrow" style="margin:12px 0 0">Contributions · Market gains · Equity built</p></div><div class="card"><div class="sectionhead"><h2>Momentum</h2><button data-detail="Momentum">Compare</button></div><p class="change">${money(42600)} this period</p><p class="muted" style="font-size:13px">Previous period: ${money(31000)}</p></div><button class="notice" data-detail="Update valuations">ⓘ Property valuation is 94 days old →</button></div>`;
    }
    function spending() {
      return `<div class="primary">${section("Where it went", `<div class="treemap"><button data-detail="Housing">Housing<strong>${money(18000)}</strong></button><button data-detail="Food">Food<strong>${money(8400)}</strong></button><button data-detail="Transport">Transport<strong>${money(6000)}</strong></button></div><button class="chip" data-detail="Categorize">Review 3 uncategorized transactions</button>`)} </div><div class="secondary"><div class="card pair"><div><small>Income</small><strong>${money(70000)}</strong></div><div><small>Net cash flow</small><strong>${money(37600)}</strong></div></div><div class="card"><div class="sectionhead"><h2>Budget</h2><button data-detail="Budget">September ›</button></div><strong>${money(32400)} / ${money(40000)}</strong><div class="progress"><i style="width:81%"></i></div><p class="muted" style="font-size:12px">81% used · ${money(7600)} remaining</p><button class="chip" data-detail="Budget">Actual vs planned</button></div>${section("Recent activity", row("Fresh market", 1400, "Food · Today", "↗") + row("City rail", 300, "Transport · Yesterday", "↗"))}${section("Events", row("Weekend trip", 5200, "12–14 September", "▦"))}<button class="notice" data-detail="Spending signals">ⓘ Food spending is 12% above the previous period</button>${section("Reports", `<div class="tools"><button class="chip" data-detail="Where">Where</button><button class="chip" data-detail="Changed">What changed</button><button class="chip" data-detail="When">When</button></div>`)}<button class="chip" data-detail="Spending settings">Spending settings</button></div>`;
    }
    function switchTab(next) {
      if (next === tab) return;
      const before = new Map(
        [...document.querySelectorAll('[style*="view-transition-name:metric-"]')].map((el) => [
          el.style.viewTransitionName,
          el.getBoundingClientRect(),
        ]),
      );
      tab = next;
      period = tab === "Spending" ? "MTD" : "3M";
      render();
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const tiles = [...document.querySelectorAll('[style*="view-transition-name:metric-"]')];
      const after = tiles.map((el) => el.getBoundingClientRect());
      tiles.forEach((el, i) => {
        const old = before.get(el.style.viewTransitionName),
          now = after[i];
        if (!old || !now.width || !now.height) return;
        el.animate(
          [
            {
              transformOrigin: "top left",
              transform: `translate(${old.left - now.left}px,${old.top - now.top}px) scale(${old.width / now.width},${old.height / now.height})`,
            },
            { transformOrigin: "top left", transform: "none" },
          ],
          { duration: 420, easing: "cubic-bezier(.22,1,.36,1)" },
        );
      });
    }

    let touchStart = null;
    document.querySelector("#content").addEventListener(
      "touchstart",
      (e) => {
        if (e.target.closest("svg,button,input,select")) return;
        touchStart = [e.touches[0].clientX, e.touches[0].clientY];
      },
      { passive: true },
    );
    document.querySelector("#content").addEventListener(
      "touchend",
      (e) => {
        if (!touchStart) return;
        const dx = e.changedTouches[0].clientX - touchStart[0],
          dy = e.changedTouches[0].clientY - touchStart[1];
        touchStart = null;
        if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) {
          const i = names.indexOf(tab) + (dx < 0 ? 1 : -1);
          if (names[i]) switchTab(names[i]);
        }
      },
      { passive: true },
    );
    function render() {
      document.body.className = `${theme} variant-${variant}`;
      document.querySelector(".tabs").innerHTML = names
        .map((t) => `<button role="tab" aria-selected="${t === tab}" data-tab="${t}">${t}</button>`)
        .join("");
      document.querySelector(".overview").innerHTML = names
        .map((t) => `<button data-tab="${t}">${t}<strong>${money(data[t].value)}</strong></button>`)
        .join("");
      document.querySelector("#content").innerHTML =
        hero() + { Investments: investments, "Net worth": networth, Spending: spending }[tab]();
      document.querySelector("#variantLabel").textContent =
        `${variant} · ${layouts[variant]} · Sample data`;
      updateURL();
      draw();
    }
    let chartValues = [];
    function draw(selected = -1) {
      const svg = document.querySelector(".chart"),
        d = data[tab],
        n = 30,
        seed =
          ["1D", "1W", "1M", "3M", "6M", "YTD", "1Y", "5Y", "All", "MTD", "Last month"].indexOf(
            period,
          ) + 1;
      chartValues = Array.from({ length: n }, (_, i) =>
        tab === "Spending"
          ? Math.round(500 + Math.abs(Math.sin(i * 1.8 + seed)) * 1500)
          : Math.round(
              d.value - (29 - i) * d.value * 0.004 + Math.sin(i * 0.8 + seed) * d.value * 0.012,
            ),
      );
      chartValues[29] = tab === "Spending" ? 1200 : d.value;
      const low = tab === "Spending" ? 0 : Math.min(...chartValues) * 0.97,
        high = Math.max(...chartValues) * 1.02,
        y = (v) => 185 - ((v - low) / (high - low)) * 165,
        x = (i) => i * 12 + 8,
        pts = chartValues.map((v, i) => `${x(i)},${y(v)}`),
        grid = [0, 1, 2]
          .map(
            (i) => `<path d="M8 ${20 + i * 80}H360" stroke="var(--line)" stroke-dasharray="2 6"/>`,
          )
          .join("");
      let plot =
        tab === "Spending"
          ? chartValues
              .map(
                (v, i) =>
                  `<rect x="${x(i)}" y="${y(v)}" width="7" height="${185 - y(v)}" rx="3" fill="var(--accent)" opacity="${selected < 0 || i === selected ? 1 : 0.25}"/>`,
              )
              .join("")
          : `<defs><linearGradient id="fill" x2="0" y2="1"><stop stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs><path d="M${pts.join("L")}L356 188L8 188Z" fill="url(#fill)"/><path d="M${pts.join("L")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${tab === "Investments" && contributions ? '<path d="M8 175L356 92" stroke="var(--blue)" stroke-width="1.5" stroke-dasharray="5 5"/>' : ""}`;
      svg.innerHTML =
        grid +
        plot +
        (selected >= 0
          ? `<path d="M${x(selected)} 15V190" stroke="var(--muted)" stroke-dasharray="3 4"/><circle cx="${x(selected)}" cy="${y(chartValues[selected])}" r="4" fill="var(--accent)"/>`
          : "") +
        '<text x="8" y="215" fill="var(--muted)" font-size="11">Period start</text><text x="300" y="215" fill="var(--muted)" font-size="11">Period end</text>';
      svg.querySelectorAll("*").forEach((el) => (el.style.pointerEvents = "none"));
      svg.setAttribute("aria-valuenow", selected >= 0 ? selected : 29);
      svg.setAttribute(
        "aria-valuetext",
        selected >= 0 ? `Sample ${selected + 1}: ${money(chartValues[selected])}` : money(d.value),
      );
      if (selected >= 0) {
        document.querySelector("#heroValue").textContent = money(chartValues[selected]);
        document.querySelector("#inspect").textContent = `Sample day ${selected + 1} · ${period}`;
      }
    }
    const mockNote =
      '<p class="muted">Sample interaction only. No account or server data is changed.</p>';
    const descriptions = {
      Breakdown: detail("Assets", money(2042600)) + detail("Liabilities", money(400000)),
      Investments: detail("Equity funds", money(170000)) + detail("Cash", money(312600)),
      Property:
        detail("Apartment", money(1500000)) +
        detail("Linked mortgage", money(400000)) +
        '<button class="chip" data-detail="Update valuations">Update valuation</button>',
      Liabilities:
        detail("Mortgage", money(400000)) +
        '<button class="chip" data-detail="Add liability">Add liability</button>',
      Budget:
        detail("September spent", money(32400)) +
        detail("Planned", money(40000)) +
        detail("Remaining", money(7600)) +
        "<p>Native flow: month navigation, cumulative actual vs planned chart, category budgets and budget editing.</p>",
      "Monthly pace":
        detail("Contributions", money(8000)) +
        detail("Market gains", money(4200)) +
        detail("Equity built", money(2000)),
      Momentum:
        detail("Current period", money(42600)) +
        detail("Previous period", money(31000)) +
        detail("Difference", money(11600)),
      "Update valuations":
        '<p>Property · last valued 94 days ago</p><button class="chip" data-detail="Valuation history">Valuation history</button>',
      "Spending settings":
        '<p>Spending is optional. Account selection, categories, rules and events remain available.</p><button class="chip" data-detail="Categories and rules">Categories and rules</button>',
      Categorize:
        row("Corner shop", 400, "Uncategorized") +
        row("Cafe", 250, "Uncategorized") +
        row("Online store", 850, "Uncategorized"),
      Goals:
        detail("Emergency fund", "60%") +
        '<button class="chip" data-detail="Add goal">Add goal</button>',
      "Data health":
        "<p>Native flow: source-data timestamp, calculation warnings, price refresh, history rebuild and health checks.</p>",
      Where:
        "<p>Category hierarchy and transaction drill-down, with savings separated from spending.</p>",
      Changed: "<p>Current vs prior period, category changes and budget comparisons.</p>",
      When: "<p>Day-of-week patterns, daily calendar and event timelines.</p>",
    };
    document.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.tab) {
        switchTab(b.dataset.tab);
      }
      if (b.dataset.period) {
        period = b.dataset.period;
        render();
      }
      if (b.dataset.page)
        show(
          b.dataset.page,
          "<p>This study covers the dashboard. Existing app navigation stays in place.</p>",
        );
      if (b.dataset.detail) {
        const key = b.dataset.detail;
        if (key === "Accounts") {
          grouped = !grouped;
          render();
        } else if (key === "Holdings")
          show(
            "Holdings filters",
            `<label>Sort<select id="sort"><option ${holdSort === "value" ? "selected" : ""} value="value">Total value</option><option ${holdSort === "gain" ? "selected" : ""} value="gain">Gain</option></select></label><label>Performance<select id="mode">${["pnl", "daily", "unrealized", "return"].map((x) => `<option ${holdMode === x ? "selected" : ""}>${x}</option>`).join("")}</select></label><label>Display<select id="display"><option ${holdName === "symbol" ? "selected" : ""} value="symbol">Symbol</option><option ${holdName === "name" ? "selected" : ""} value="name">Name</option></select></label><p class="muted">Apply by changing a selection.</p>`,
          );
        else
          show(
            key,
            (descriptions[key] ||
              detail("Sample amount", money(12000)) +
                "<p>Native destination: detail view with related records and actions.</p>") +
              mockNote,
          );
      }
    });
    document.addEventListener("change", (e) => {
      if (e.target.id === "sort") holdSort = e.target.value;
      if (e.target.id === "mode") holdMode = e.target.value;
      if (e.target.id === "display") holdName = e.target.value;
      render();
    });
    document.querySelector(".close").onclick = () => document.querySelector("#sheet").close();
    document.querySelector("#privacy").onclick = () => {
      hidden = !hidden;
      render();
    };
    document.querySelector("#theme").onclick = () => {
      theme = theme === "dark" ? "light" : "dark";
      render();
    };
    function cycle(n) {
      variant = ["A", "B", "C"][(["A", "B", "C"].indexOf(variant) + n + 3) % 3];
      render();
    }
    document.querySelector("#prev").onclick = () => cycle(-1);
    document.querySelector("#next").onclick = () => cycle(1);
    document.querySelector("#more").onclick = () =>
      show(
        "Dashboard actions",
        [
          "Sync now",
          "Update prices",
          "Rebuild full history",
          "Verify data",
          "Broker sync · if connected",
        ]
          .map((x) => `<button class="row" data-detail="${x}">${x} ›</button>`)
          .join("") + mockNote,
      );
    document.querySelector("#add").onclick = () =>
      show(
        "Add",
        (tab === "Net worth"
          ? ["Add asset", "Add liability", "Link mortgage"]
          : ["Quick Add", "Record transaction", "Add account"]
        )
          .map((x) => `<button class="row" data-detail="${x}">${x} ›</button>`)
          .join("") + mockNote,
      );
    document.querySelector("#coverage").onclick = () =>
      show(
        "Feature coverage",
        "<p>Investments: history, contributions, returns, all periods, grouped accounts, holding filters, goals and health.</p><p>Net worth: history, breakdown and detail sheets, monthly pace, momentum, stale valuations, assets and liabilities.</p><p>Spending: periods, cash flow, daily chart, category drill-down, budget, recent activity, events, signals, categorization and reports.</p><p>Full behavior and conditional features are documented in dashboard-feature-map.md. This mockup demonstrates navigation and hierarchy, not production calculations.</p>",
      );
    document.addEventListener("click", (e) => {
      if (e.target.closest("#contributions")) {
        contributions = !contributions;
        render();
      }
    });
    document.addEventListener("pointermove", (e) => {
      if (e.target.matches(".chart") && e.pointerType !== "touch") {
        const r = e.target.getBoundingClientRect();
        draw(Math.max(0, Math.min(29, Math.round(((e.clientX - r.left) / r.width) * 29))));
      }
    });
    document.addEventListener("pointerdown", (e) => {
      if (e.target.matches(".chart")) {
        const r = e.target.getBoundingClientRect();
        draw(Math.max(0, Math.min(29, Math.round(((e.clientX - r.left) / r.width) * 29))));
      }
    });
    document.addEventListener("keydown", (e) => {
      if (e.target.matches(".chart")) {
        let i = Number(e.target.getAttribute("aria-valuenow"));
        if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
          e.preventDefault();
          draw(Math.max(0, Math.min(29, i + (e.key === "ArrowRight" ? 1 : -1))));
        }
        return;
      }
      if (e.target.closest("dialog,input,select,textarea")) return;
      if (e.key === "ArrowLeft") cycle(-1);
      if (e.key === "ArrowRight") cycle(1);
    });
    render();
  </script>
</html>
